[project]
name = "survey-local-admin"
version = "0.1.0"
description = "Local Admin web app for importing cases/recipients and generating per-recipient questionnaire variants."
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "certifi>=2024.0.0",
]
license = {text = "MIT"}
authors = [{name = "Isaac Kohane"}]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


